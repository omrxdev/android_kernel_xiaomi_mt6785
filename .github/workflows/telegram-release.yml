name: Telegram Release Notify

on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send message + upload assets
        run: |
          BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"

          RELEASE_NAME="${{ github.event.release.name }}"
          TAG="${{ github.event.release.tag_name }}"
          URL="${{ github.event.release.html_url }}"

          # Save release body safely to file
          cat << 'EOF' > body.txt
          ${{ github.event.release.body }}
          EOF

          # Build message safely
          MESSAGE=$(printf "🚀 New Release Published!\n\nName: %s\nVersion: %s\n\nChangelog:\n%s\n\nView on GitHub:\n%s\n" \
            "$RELEASE_NAME" "$TAG" "$(cat body.txt)" "$URL")

          # Send message
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            --data-urlencode text="${MESSAGE}"

          # Install jq
          sudo apt-get update
          sudo apt-get install -y jq

          # Upload assets
          echo '${{ toJson(github.event.release.assets) }}' | jq -r '.[].browser_download_url' | while read asset; do
            filename=$(basename "$asset")
            curl -L "$asset" -o "$filename"
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
              -F chat_id="${CHAT_ID}" \
              -F document=@"$filename"
          done
