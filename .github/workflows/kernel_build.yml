name: Kernel Build

on:
  workflow_dispatch:
  push:
    branches:
      - openELA-4.19

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      OUT: out
      ARCH: arm64
      SUBARCH: arm64
      DEFCONFIG: rosemary_defconfig
      KERNEL_IMAGE: out/arch/arm64/boot/Image.gz
      ANYKERNEL_DIR: builds/AnyKernel3
      ZIP_OUT: ${{ github.workspace }}/builds
      TOOLCHAIN_DIR: ${{ github.workspace }}/clang
      TOOLCHAIN_NAME: clang

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive  

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex libssl-dev libelf-dev zip curl

      - name: Cache clang toolchain
        uses: actions/cache@v4
        with:
          path: ${{ env.TOOLCHAIN_DIR }}
          key: clang-r563880

      - name: Setup clang r563880
        run: |
          if [ ! -f "$TOOLCHAIN_DIR/bin/clang" ]; then
            mkdir -p $TOOLCHAIN_DIR
            cd $TOOLCHAIN_DIR

            curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android16-qpr2-release/clang-r563880.tar.gz -o clang-r563880.tar.gz
            tar -xzf clang-r563880.tar.gz
          fi

      - name: Setup environment
        run: |
          echo "ARCH=$ARCH" >> $GITHUB_ENV
          echo "SUBARCH=$SUBARCH" >> $GITHUB_ENV
          echo "CC=$TOOLCHAIN_NAME" >> $GITHUB_ENV
          echo "LD=ld.lld" >> $GITHUB_ENV
          echo "LLVM=1" >> $GITHUB_ENV
          echo "LLVM_IAS=1" >> $GITHUB_ENV
          echo "$TOOLCHAIN_DIR/bin" >> $GITHUB_PATH

      - name: Prepare directories
        run: |
          rm -rf $OUT   # 🔥 ensures clean build every time
          mkdir -p $OUT
          mkdir -p $ZIP_OUT

      - name: Configure kernel
        run: |
          make O=$OUT $DEFCONFIG

      - name: Inject SUSFS configs
        run: |
          CONFIG_FILE="$OUT/.config"

          CONFIGS=(
            "CONFIG_KSU_SUSFS=y"
            "CONFIG_KSU_SUSFS_SUS_PATH=y"
            "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
            "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y"
            "CONFIG_KSU_SUSFS_TRY_UMOUNT=y"
            "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
            "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
            "CONFIG_KSU_SUSFS_SUS_SU=y"
          )

          for cfg in "${CONFIGS[@]}"; do
            key="${cfg%=*}"
            sed -i "/^${key}[= ]/d" "$CONFIG_FILE"
            sed -i "/# ${key} is not set/d" "$CONFIG_FILE"
            echo "$cfg" >> "$CONFIG_FILE"
          done

          make O=$OUT olddefconfig

      - name: Verify config
        run: |
          grep -q "^CONFIG_KSU_SUSFS_SUS_MOUNT=y" "$OUT/.config"

      - name: Build kernel
        run: |
          make O=$OUT -j$(nproc --all)

      - name: Get kernel version
        id: kver
        run: |
          KVER=$(make O=$OUT -s kernelversion || echo "unknown")
          echo "kver=$KVER" >> $GITHUB_OUTPUT

      - name: Package AnyKernel3
        run: |
          if [ ! -f "$KERNEL_IMAGE" ]; then
            echo "Kernel image not found!"
            exit 1
          fi

          ZIP_NAME="kernel-${{ steps.kver.outputs.kver }}-$(date +%Y%m%d-%H%M).zip"

          rm -f "$ANYKERNEL_DIR/Image.gz" "$ANYKERNEL_DIR/Image"
          cp "$KERNEL_IMAGE" "$ANYKERNEL_DIR/"

          cd "$ANYKERNEL_DIR"
          zip -r9 "$ZIP_OUT/$ZIP_NAME" . -x '*.zip'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: builds/*.zip
